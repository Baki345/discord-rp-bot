services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: runs `prisma migrate deploy` then exits. bot/dashboard wait on
  # it (service_completed_successfully) so `docker compose up -d` alone is
  # enough on every deploy — no manual migration step.
  migrate:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "--filter", "@discord-rp/database", "exec", "prisma", "migrate", "deploy"]

  bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # Bound to localhost only — the host's own nginx (already terminating
    # TLS for the other sites on this VPS) reverse-proxies rp.xultra.space
    # to this port. See DASHBOARD_LOCAL_PORT in .env.example.
    ports:
      - "127.0.0.1:${DASHBOARD_LOCAL_PORT}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
